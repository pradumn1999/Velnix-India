<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="100%" height="100%">
  <!-- Background -->
  <rect width="360" height="90" rx="6" fill="#381219" />
  
  <!-- Emblem (V Icon) -->
  <g transform="translate(18, 10)" fill="#F4EFE6">
    <!-- Top-left horizontal bar with angled cuts -->
    <polygon points="2,12 28,12 22,23 2,23" />
    
    <!-- Outer Left Diagonal (below the slice gap) -->
    <polygon points="17,32 37,32 50,68 37,68" />
    
    <!-- Inner V (Double Chevron) -->
    <!-- Inner V - Left arm -->
    <polygon points="34,12 47,12 50,60 41,60" />
    <!-- Inner V - Right arm -->
    <polygon points="41,60 50,60 74,12 61,12" />
    
    <!-- Outer Right Diagonal -->
    <polygon points="50,68 63,68 88,12 75,12" />
  </g>

  <!-- Typography -->
  <!-- VELNIX -->
  <text 
    x="126" 
    y="50" 
    fill="#F4EFE6" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="37" 
    font-weight="900" 
    letter-spacing="4.5"
  >
    VELNIX
  </text>
  
  <!-- FASHION APPAREL -->
  <text 
    x="127" 
    y="71" 
    fill="#F4EFE6" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="11" 
    font-weight="500" 
    letter-spacing="4"
  >
    FASHION APPAREL
  </text>
</svg>
